# Publishes the wiki/ folder to the GitHub wiki whenever it changes.
name: Wiki

on:
  push:
    branches: [main]
    paths: ["wiki/**", ".github/workflows/wiki.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" published
          rsync -a --delete --exclude .git wiki/ published/
          cd published
          git config user.name "Le-Oreo"
          git config user.email "122897926+Le-Oreo@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Update wiki"
          git push
