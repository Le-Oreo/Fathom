# Builds the installers for Windows, macOS and Linux.
# To make a release: Actions > FATHOM installers > Run workflow, and type the version (like 0.2.0).
# It creates a draft release with the installers attached; publish it from the Releases page.
# Without a version it only builds, and the installers are under the run's Artifacts.
name: FATHOM installers

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, like 0.2.0. Leave empty to only build."
        required: false
        default: ""
  push:
    branches: ["**"]
    paths: [".github/workflows/fathom-release.yml"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    if: (inputs.version || '') != ''
    outputs:
      id: ${{ steps.create.outputs.id }}
    steps:
      - uses: actions/checkout@v4
      - id: create
        uses: actions/github-script@v7
        env:
          VERSION: ${{ inputs.version }}
        with:
          script: |
            const fs = require("fs");
            const version = process.env.VERSION.trim().replace(/^v/, "");
            const tag = `fathom-v${version}`;
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            if (pkg.version !== version) {
              core.setFailed(`package.json says ${pkg.version}, not ${version}. Bump the version first.`);
              return;
            }
            const { data } = await github.rest.repos.createRelease({
              ...context.repo,
              tag_name: tag,
              target_commitish: context.sha,
              name: `FATHOM ${version}`,
              body: fs.readFileSync(".github/release-notes.md", "utf8").replaceAll("{version}", version),
              draft: true,
            });
            core.setOutput("id", data.id);

  build:
    needs: release
    if: always() && needs.release.result != 'failure' && needs.release.result != 'cancelled'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            args: "--bundles nsis"
          - os: macos-latest
            name: macos-apple-silicon
            args: "--target aarch64-apple-darwin --bundles dmg"
            rust-targets: aarch64-apple-darwin
          - os: macos-latest
            name: macos-intel
            args: "--target x86_64-apple-darwin --bundles dmg"
            rust-targets: x86_64-apple-darwin
          - os: ubuntu-22.04
            name: linux
            args: "--bundles appimage,deb,rpm"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Linux build dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libudev-dev libdbus-1-dev rpm
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: .
          args: ${{ matrix.args }}
          releaseId: ${{ needs.release.outputs.id }}
      - uses: actions/upload-artifact@v4
        with:
          name: FATHOM-${{ matrix.name }}
          path: |
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/appimage/*.AppImage
            src-tauri/target/**/release/bundle/deb/*.deb
            src-tauri/target/**/release/bundle/rpm/*.rpm
          if-no-files-found: error
